<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - EduSchedule</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-blue: #3498db;
            --dark-blue: #2980b9;
            --light-blue: #5dade2;
            --gradient-primary: linear-gradient(135deg, #3498db, #2c3e50);
            --gradient-secondary: linear-gradient(135deg, #5dade2, #3498db);
            --gradient-light: linear-gradient(135deg, #e8f4fc, #d6eaf8);
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--gradient-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .registration-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            max-width: 900px;
            margin: 30px auto;
        }
        
        .registration-header {
            background: var(--gradient-primary);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .registration-header h1 {
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .registration-header p {
            opacity: 0.9;
            margin-bottom: 0;
        }
        
        .registration-form {
            padding: 40px;
        }
        
        .user-type-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .user-type-card {
            flex: 1;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .user-type-card:hover {
            border-color: var(--light-blue);
            transform: translateY(-5px);
        }
        
        .user-type-card.selected {
            border-color: var(--primary-blue);
            background: var(--gradient-light);
        }
        
        .user-icon {
            font-size: 40px;
            color: var(--primary-blue);
            margin-bottom: 15px;
        }
        
        .form-section {
            display: none;
        }
        
        .form-section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .form-control {
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 0.25rem rgba(52, 152, 219, 0.25);
        }
        
        .btn-primary {
            background: var(--gradient-secondary);
            border: none;
            padding: 12px 30px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .form-label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #495057;
        }
        
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #6c757d;
        }
        
        .login-link a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="registration-container">
            <div class="registration-header">
                <h1><i class="bi bi-journal-check me-2"></i>Регистрация в EduSchedule</h1>
                <p>Присоединяйтесь к нашему сервису расписания колледжа</p>
            </div>
            
            <div class="registration-form">
                <!-- Выбор типа пользователя -->
                <div class="user-type-selector">
                    <div class="user-type-card" data-user-type="student">
                        <div class="user-icon">
                            <i class="bi bi-person"></i>
                        </div>
                        <h4>Студент</h4>
                        <p>Доступ к расписанию своей группы</p>
                    </div>
                    <div class="user-type-card" data-user-type="teacher">
                        <div class="user-icon">
                            <i class="bi bi-person-badge"></i>
                        </div>
                        <h4>Преподаватель</h4>
                        <p>Доступ после подтверждения администратором</p>
                    </div>
                </div>
                
                <!-- Форма для студента -->
                <form id="studentForm" class="form-section" method="POST" action="signup.php">
                    <input type="hidden" name="role" value="student">
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label for="studentFullName" class="form-label">ФИО</label>
                            <input type="text" class="form-control" id="studentFullName" name="fullname" placeholder="Иванов Иван Иванович" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="studentEmail" class="form-label">Электронная почта</label>
                            <input type="email" class="form-control" id="studentEmail" name="email" placeholder="example@mail.ru" required>
                        </div>
                        <div class="col-md-3">
                            <label for="studentFaculty" class="form-label">Группа</label>
                            <select class="form-select" id="studentFaculty" name="faculty_id" required>
                                <option value="" selected disabled>Выберите группу</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="studentLetter" class="form-label">Буква группы</label>
                            <select class="form-select" id="studentLetter" name="group_letter" required>
                                <option value="" selected disabled>Выберите букву</option>
                                <option value="А">А</option>
                                <option value="Б">Б</option>
                                <option value="В">В</option>
                                <option value="Г">Г</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="studentLogin" class="form-label">Логин</label>
                            <input type="text" class="form-control" id="studentLogin" name="login" placeholder="Придумайте логин" required>
                        </div>
                        <div class="col-md-6">
                            <label for="studentPassword" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="studentPassword" name="password" placeholder="Придумайте пароль" required>
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Зарегистрироваться как студент</button>
                    </div>
                </form>

                <!-- Форма для преподавателя -->
                <form id="teacherForm" class="form-section" method="POST" action="signup.php">
                    <input type="hidden" name="role" value="teacher">
                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label for="teacherFullName" class="form-label">ФИО</label>
                            <input type="text" class="form-control" id="teacherFullName" name="fullname" placeholder="Иванова Мария Петровна" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="teacherEmail" class="form-label">Электронная почта</label>
                            <input type="email" class="form-control" id="teacherEmail" name="email" placeholder="example@mail.ru" required>
                        </div>
                        <div class="col-md-6">
                            <label for="teacherLogin" class="form-label">Логин</label>
                            <input type="text" class="form-control" id="teacherLogin" name="login" placeholder="Придумайте логин" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label for="teacherPassword" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="teacherPassword" name="password" placeholder="Придумайте пароль" required>
                        </div>
                    </div>

                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i> 
                        Ваш аккаунт будет активирован после подтверждения администратором
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Зарегистрироваться как преподаватель</button>
                    </div>
                </form>
                
                <div class="login-link">
                    Уже есть аккаунт? <a href="login.html">Войдите здесь</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const userTypeCards = document.querySelectorAll('.user-type-card');
            const studentForm = document.getElementById('studentForm');
            const teacherForm = document.getElementById('teacherForm');
            
            // Выбор типа пользователя
            userTypeCards.forEach(card => {
                card.addEventListener('click', function() {
                    userTypeCards.forEach(c => c.classList.remove('selected'));
                    this.classList.add('selected');

                    const userType = this.getAttribute('data-user-type');
                    if (userType === 'student') {
                        studentForm.classList.add('active');
                        teacherForm.classList.remove('active');
                        studentForm.querySelector('input[name="role"]').value = 'student';
                    } else {
                        teacherForm.classList.add('active');
                        studentForm.classList.remove('active');
                        teacherForm.querySelector('input[name="role"]').value = 'teacher';
                    }
                });
            });
            
            // По умолчанию выбираем студента
            document.querySelector('.user-type-card[data-user-type="student"]').click();
            
            // Загружаем список групп
            fetch('get_faculties.php')
                .then(response => response.json())
                .then(faculties => {
                    const select = document.getElementById('studentFaculty');
                    faculties.forEach(faculty => {
                        const option = document.createElement('option');
                        option.value = faculty.id;
                        option.textContent = faculty.name + ' - ' + faculty.full_name;
                        select.appendChild(option);
                    });
                })
                .catch(error => console.error('Ошибка загрузки групп:', error));
        });
    </script>
</body>
</html>
